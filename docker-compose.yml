version: '3.8'

services:
  # 1. Auth Service (Регистрация с bcrypt + генерация JWT)
  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: lab7-auth-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - JWT_SECRET=${JWT_SECRET:-tpu_lab7_jwt_secret_key_8i42_2026_secure}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - AUTH_DB_PATH=/tmp/auth_users.db
    networks:
      - lab7-network

  # 2. Catalog Service (Внутренний сервис каталога с RBAC по X-User-Role)
  catalog-service:
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    container_name: lab7-catalog-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    networks:
      - lab7-network

  # 3. Order Service (Внутренний сервис заказов с RBAC по X-User-Role)
  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: lab7-order-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    networks:
      - lab7-network

  # 4. API Gateway (Единая точка входа: JWT валидация, X-User-Id/X-User-Role, Rate Limiting)
  api-gateway:
    build:
      context: .
      dockerfile: api_gateway/Dockerfile
    container_name: lab7-api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET:-tpu_lab7_jwt_secret_key_8i42_2026_secure}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - CATALOG_SERVICE_URL=http://catalog-service:8002
      - ORDER_SERVICE_URL=http://order-service:8003
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-900}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOGIN_RATE_LIMIT_MAX_REQUESTS=${LOGIN_RATE_LIMIT_MAX_REQUESTS:-5}
    depends_on:
      - auth-service
      - catalog-service
      - order-service
    networks:
      - lab7-network

networks:
  lab7-network:
    driver: bridge
